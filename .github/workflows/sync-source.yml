name: Sincronizar aplicação de origem

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-source.yml'

permissions:
  contents: write

concurrency:
  group: sync-source
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório de destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clonar repositório de origem
        run: |
          git clone --depth 1 https://github.com/AndreGregoletto/AndreGregoletto-.git /tmp/source

      - name: Copiar aplicação preservando dados próprios
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/sync-source.yml' \
            --exclude '.github/workflows/static.yml' \
            --exclude 'data.json' \
            --exclude 'training-progress.json' \
            --exclude 'index.html' \
            --exclude 'script.js' \
            --exclude 'service-worker.js' \
            --exclude 'training-dashboard.js' \
            /tmp/source/ ./

      - name: Publicar atualização
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Aplicação já está sincronizada."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: sync application from source'
          git push
