name: Sincronizar repositório de origem

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-source.yml'

permissions:
  contents: write

concurrency:
  group: sync-source
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório de destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clonar repositório de origem
        run: |
          git clone --depth 1 https://github.com/AndreGregoletto/AndreGregoletto-.git /tmp/source

      - name: Copiar conteúdo
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/sync-source.yml' \
            --exclude '.github/workflows/static.yml' \
            /tmp/source/ ./

      - name: Publicar cópia
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Destino já está sincronizado."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: sync source repository'
          git push
